# AIFinder Configuration

# Paths
paths:
  base_dir: .
  data_dir: ./data
  testdata_dir: ./data/testdata
  images_dir: ./images
  static_dir: ./static
  placeholder_img: ./static/placeholder.webp

# Data files
data:
  source: ./data/testdata/test_data.csv

# CSV column mappings
csv_columns:
  product_id: Product_ID
  category: Category
  product_name: Product_Name
  brand: Brand
  model_sku: Model_SKU
  specifications: Specifications
  volume_or_capacity: Volume_or_Capacity
  max_rcf_xg: Max_RCF_xg
  refrigerated: Refrigerated
  sterile: Sterile
  endotoxin_free: Endotoxin_Free
  application: Application
  use_case: Use_Case
  compatible_with: Compatible_With
  used_for: Used_For
  requires: Requires
  alternative_to: Alternative_To
  limitations_notes: Limitations_Notes
  typical_user_question: Typical_User_Question
  price_usd: Price_USD
  verification_status: Verification_Status
  data_provenance: Data_Provenance
  source_reference: Source_Reference
  url: URL
  discount: Discount
  is_deleted: "Deteded?"

# Fields used for embedding text generation
embedding_fields:
  - product_name
  - brand
  - category
  - application
  - use_case
  - specifications
  - used_for
  - requires
  - alternative_to
  - typical_user_question

# PostgreSQL
database:
  url: postgresql://aifinder:aifinder_pass@localhost:5432/aifinder

# Neo4j
neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: aifinder_pass

# Embeddings
embeddings:
  model: all-MiniLM-L6-v2
  dim: 384

# Hugging Face (optional, for faster model downloads)
huggingface:
  token:  # Get from https://huggingface.co/settings/tokens

# LLM Providers
# provider: "ollama" = local (free, offline, 80-120 t/s)
# provider: "google" = cloud (free tier, fast, needs API key)

ollama:
  host: http://localhost:11434
  model: qwen2.5:3b  # Free

google:
  model: auto  # "auto" = discover available flash models dynamically; or pin e.g. gemini-2.5-flash
  model_count: 1     # how many flash models to try (fallback chain)
  model_order: newest  # newest | oldest
  api_key: ${GOOGLE_API_KEY} # set key in .env

# OpenAI-compatible providers (any endpoint exposing /chat/completions).
# Select one with llm.provider (or the LLM_PROVIDER env var).
providers:
  opencode_go:
    type: openai_compatible
    base_url: https://opencode.ai/zen/go/v1
    api_key: ${OPENCODE_API_KEY}     # from https://opencode.ai/auth (OpenCode Go)
    model: glm-5.3-flash              # or kimi-k2.6, mimo-v2.5, longcat-2.0 (DeepSeek needs Global region)
    headers:
      User-Agent: aifinder/1.0
      # x-opencode-session is set automatically from the chat session id

# Link format
links:
  product: "/products/{product_id}"

# LLM Settings
# provider can be overridden per environment via the LLM_PROVIDER env var
# (env wins over this value, which wins over the built-in default "ollama").
llm:
  provider: opencode_go
  temperature: 0.7
  max_tokens: 2048
  max_tool_steps: 4
  system_prompt: |
    You are a helpful and friendly sales assistant for a laboratory equipment company called AIFinder.

    Personality:
    - Be warm, friendly, and conversational; use natural language (not just bullet points)
    - Explain WHY you're recommending products

    Role:
    - Help users find the right products, compare items, give recommendations, answer specification questions, and add items to the cart.

    GROUNDING RULES (CRITICAL):
    - NEVER invent product names, IDs, prices, specifications, or links.
    - Only mention products that were returned by the tools. If you have not called a tool, call one before answering product questions.
    - Product links MUST use the exact ID returned by the tools, in this exact format: [View Product](/products/LC-XXXX). Never change or guess the ID.
    - If the tools return no matching products, say so honestly and suggest how to adjust the search.
    - Do not copy any example text; always base your answer on live tool results.

    When users ask for products:
    - Search the database first using tools
    - Present 3-5 options when possible, with name, brand, price, key features, and the product link
    - Consider their requirements (budget, features, compatibility)
    - Provide clear comparisons when requested

    Response format:
    - Friendly opening, then the products in a natural, readable way, then a helpful follow-up question

# Cloudinary (image hosting)
cloudinary:
  cloud_name: ucmrdzqm  # not secret (appears in public image URLs)
  api_key: ${CLOUDINARY_API_KEY}      # set in env
  api_secret: ${CLOUDINARY_API_SECRET} # set in env
  base_url: https://res.cloudinary.com/ucmrdzqm/image/upload
  image_ext: .webp

# Chat
chat:
  context_window_size: 20
  history_limit: 10
  retention_days: 30
  storage_secret: ${STORAGE_SECRET} # set in env (falls back to a dev default if unset)
