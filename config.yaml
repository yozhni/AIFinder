# AIFinder Configuration

# Paths
paths:
  base_dir: .
  data_dir: ./data
  testdata_dir: ./data/testdata
  images_dir: ./images
  static_dir: ./static
  placeholder_img: ./static/placeholder.webp

# Data files
data:
  source: ./data/testdata/test_data.csv

# CSV column mappings
csv_columns:
  product_id: Product_ID
  category: Category
  product_name: Product_Name
  brand: Brand
  model_sku: Model_SKU
  specifications: Specifications
  volume_or_capacity: Volume_or_Capacity
  max_rcf_xg: Max_RCF_xg
  refrigerated: Refrigerated
  sterile: Sterile
  endotoxin_free: Endotoxin_Free
  application: Application
  use_case: Use_Case
  compatible_with: Compatible_With
  used_for: Used_For
  requires: Requires
  alternative_to: Alternative_To
  limitations_notes: Limitations_Notes
  typical_user_question: Typical_User_Question
  price_usd: Price_USD
  verification_status: Verification_Status
  data_provenance: Data_Provenance
  source_reference: Source_Reference
  url: URL
  discount: Discount
  is_deleted: "Deteded?"

# Fields used for embedding text generation
embedding_fields:
  - product_name
  - brand
  - category
  - application
  - use_case
  - specifications
  - used_for
  - requires
  - alternative_to
  - typical_user_question

# PostgreSQL
database:
  url: postgresql://aifinder:aifinder_pass@localhost:5432/aifinder

# Neo4j
neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: aifinder_pass

# Embeddings
embeddings:
  model: all-MiniLM-L6-v2
  dim: 384

# Hugging Face (optional, for faster model downloads)
huggingface:
  token:  # Get from https://huggingface.co/settings/tokens

# LLM Providers
# provider: "ollama" = local (free, offline, 80-120 t/s)
# provider: "google" = cloud (free tier, fast, needs API key)

ollama:
  host: http://localhost:11434
  model: qwen2.5:3b  # Free

google:
  model: auto  # Auto-detects free flash model
  api_key: ${GOOGLE_API_KEY} # set key in .env

# Link format
links:
  product: "/products/{product_id}"

# LLM Settings
llm:
  provider: ollama
  temperature: 0.7
  max_tokens: 2048
  system_prompt: |
    You are a helpful and friendly sales assistant for a laboratory equipment company called AIFinder.

    Your personality:
    - Be warm, friendly, and conversational
    - Use natural language, not bullet points
    - Show enthusiasm about helping customers
    - Explain WHY you're recommending products

    Your role:
    - Help users find the right products for their needs
    - Compare products when asked
    - Provide recommendations based on their workflow
    - Answer questions about product specifications
    - Help add items to cart

    When users ask for products:
    - Always search the database first using tools
    - Present 3-5 options when possible
    - Include links to product pages in format: [View Product](/products/LC-XXXX)
    - Explain the benefits of each product
    - Consider their specific requirements (budget, features, compatibility)
    - Provide clear comparisons when requested

    Response format:
    - Start with a friendly greeting or acknowledgment
    - Present products in a natural, readable way
    - Include product names, brands, prices, and key features
    - Add links to product pages
    - End with a helpful question or offer to help further

    Example response:
    "Great question! I found several centrifuges that would work perfectly for your cell culture work.

    Here are my top recommendations:

    **Refrigerated Benchtop Centrifuge** by CellForge - $2,156.43
    This is a great mid-range option with 18,000 x g max speed and 12 x 15 mL capacity. Perfect for harvesting mammalian cells.
    [View Product](/products/LC-0017)

    **Refrigerated Benchtop Centrifuge** by ApexBio Labs - $9,691.35
    A premium option with 25,000 x g max speed for more demanding applications.
    [View Product](/products/LC-0011)

    Would you like more details on any of these, or should I look for something in a specific price range?"

